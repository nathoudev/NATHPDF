<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nath PDF</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-900">

<header class="fixed top-0 w-full bg-white/80 backdrop-blur-md border-b z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between">
    <div class="flex items-center gap-2">
      <div class="text-2xl">📄</div>
      <span class="text-2xl font-bold">Nath PDF</span>
    </div>
  </div>
</header>

<main class="pt-24">

<section class="text-center max-w-4xl mx-auto px-6 py-20">
  <h1 class="text-5xl font-bold mb-6">
    Convertissez vos fichiers en PDF
  </h1>

  <p class="text-xl text-gray-600 mb-10">
    Simple. Rapide. Sans inscription.
  </p>

  <p class="text-gray-500">
    ✨ 3 conversions gratuites par jour
  </p>
</section>

<form id="convertForm" class="max-w-2xl mx-auto px-6 mb-20">

  <div id="dropZone"
       class="w-full border-2 border-dashed border-gray-300 rounded-xl p-12 text-center cursor-pointer hover:border-blue-400 transition">

    <div class="text-5xl mb-4">⬆️</div>

    <p class="text-lg font-semibold text-gray-700">
      Glissez vos fichiers ici ou cliquez pour sélectionner
    </p>

    <p class="text-sm text-gray-500 mt-2">
      PDF, Word, Excel, PowerPoint et plus encore
    </p>

    <input id="fileInput" type="file" class="hidden" />
  </div>

  <button id="convertBtn" type="submit"
    class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition">
    Convertir
  </button>

  <div id="successBox" class="hidden mt-4 p-4 bg-green-100 border border-green-400 rounded-lg">
    <p class="text-green-800 font-medium">Conversion réussie !</p>
    <a id="downloadLink" href="#" download class="mt-2 inline-block bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
      Télécharger PDF
    </a>
  </div>

  <div id="errorBox" class="hidden mt-4 p-4 bg-red-100 border border-red-400 rounded-lg text-red-800"></div>

</form>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("convertForm");
  const fileInput = document.getElementById("fileInput");
  const dropZone = document.getElementById("dropZone");
  const successBox = document.getElementById("successBox");
  const errorBox = document.getElementById("errorBox");
  const downloadLink = document.getElementById("downloadLink");

  // Clic sur la zone de drop
  dropZone.addEventListener("click", () => fileInput.click());

  // Drag and drop
  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("border-blue-500", "bg-blue-50");
  });

  dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("border-blue-500", "bg-blue-50");
  });

  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("border-blue-500", "bg-blue-50");
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
    }
  });

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    successBox.classList.add("hidden");
    errorBox.classList.add("hidden");

    const file = fileInput.files[0];
    if (!file) {
      errorBox.textContent = "Veuillez sélectionner un fichier";
      errorBox.classList.remove("hidden");
      return;
    }

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch("/convert", {
        method: "POST",
        body: formData
      });

      if (!res.ok) throw new Error("Erreur de conversion");

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);

      downloadLink.href = url;
      downloadLink.download = file.name.replace(/\.[^/.]+$/, "") + ".pdf";

      successBox.classList.remove("hidden");

    } catch (err) {
      errorBox.classList.remove("hidden");
      errorBox.textContent = "Erreur de conversion : " + err.message;
    }
  });
});
</script>

</body>
</html>
