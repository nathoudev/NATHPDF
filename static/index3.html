<body class="bg-white text-gray-900">

<header class="fixed top-0 w-full bg-white/80 backdrop-blur-md border-b z-50">

      <span class="text-2xl font-bold">Nath PDF</span>

  </div>
</header>

<main class="pt-24">

<section class="text-center max-w-4xl mx-auto px-6 py-20">
  <h1 class="text-5xl font-bold mb-6">
    Convertissez vos fichiers en PDF

  <p class="text-xl text-gray-600 mb-10">
    Simple. Rapide. Sans inscription.
  </p>

  <p class="text-gray-500">
    ✨ 3 conversions gratuites par jour
  </p>
</section>

<!-<form id="convertForm">

  <div id="dropZone"

</form>


</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("convertForm");
  const fileInput = document.getElementById("fileInput");
  const successBox = document.getElementById("successBox");
  const errorBox = document.getElementById("errorBox");
  const downloadLink = document.getElementById("downloadLink");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    successBox.classList.add("hidden");
    errorBox.classList.add("hidden");

    const file = fileInput.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch("/convert", {
        method: "POST",
        body: formData
      });

      if (!res.ok) throw new Error("Erreur");

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);

      downloadLink.href = url;
      downloadLink.download = "converted.pdf";

      successBox.classList.remove("hidden");

    } catch (err) {
      errorBox.classList.remove("hidden");
      errorBox.textContent = "Erreur de conversion";
    }
  });
});
</script>

</body>
</html>
