<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NATHPDF - Convertisseur Universel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px; background: #f4f7f6; }
        .upload-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; }
        input[type="file"] { margin: 20px 0; }
        button { background: #007bff; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        #status { margin-top: 20px; color: #555; }
    </style>
</head>
<body>
<form id="convertForm" class="mt-6">
  <div class="rounded-2xl border border-dashed p-6">
    <input id="fileInput" type="file" class="block w-full text-sm" />
  </div>

  <button id="convertBtn" type="submit"
          class="mt-4 w-full rounded-2xl bg-blue-600 px-4 py-3 text-white font-semibold hover:bg-blue-700">
    Convert to PDF
  </button>
</form>

    <script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("convertForm");

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];

        if (!file) {
            alert("Choisis un fichier");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch("/convert", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text || "Erreur conversion");
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = file.name.replace(/\.[^/.]+$/, "") + ".pdf";
            document.body.appendChild(a);
            a.click();
            a.remove();

            window.URL.revokeObjectURL(url);

        } catch (err) {
            console.error(err);
            alert("Erreur : " + err.message);
        }
    });
});
</script>
</body>
</html>
