

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Acheter un pack de conversions PDF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
      max-width: 420px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      margin-top: 0;
      color: #4b5563;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.25rem;
      font-weight: 500;
    }
    input[type="email"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid #d1d5db;
      font-size: 0.95rem;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.75rem;
      border-radius: 9999px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      background: #4f46e5;
      color: white;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      margin-top: 0.75rem;
      color: #b91c1c;
      font-size: 0.85rem;
    }
    .info {
      margin-top: 0.75rem;
      color: #059669;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Acheter un pack PDF</h1>
    <p>
      Achetez un pack de <strong>100 conversions PDF</strong> pour <strong>5€</strong>.<br />
      Après le paiement, vous recevrez votre <strong>clé API</strong> par email.
    </p>

    <label for="email">Votre adresse email</label>
    <input id="email" type="email" placeholder="vous@example.com" required />

    <button id="payBtn">Payer avec Paypal
    </button>

    <div id="message" class=""></div>
  </div>

<script src="https://www.paypal.com/sdk/js?client-id=AZ_jXJXnqJUTO3Nu5xcM_ErnWyzGTlMirvA6_Opn_G-XyCQu7U9K8KQ8vrSIaPiYHABgxP0LdGQrLqV7&currency=EUR"></script>

<div id="paypal-button-container"></div>

<script>
paypal.Buttons({
    createOrder: function(data, actions) {
        return fetch('/paypal/create-order', {
            method: 'post'
        }).then(res => res.json())
          .then(data => data.orderID);
    },
    onApprove: function(data, actions) {
        return fetch('/paypal/capture-order?orderID=' + data.orderID + '&email=test@example.com', {
            method: 'post'
        }).then(res => res.json())
          .then(details => {
              alert("Paiement réussi ! Clé API : " + details.api_key);
          });
    }
}).render('#paypal-button-container');
</script>

</body>
</html>
