<script>
async function loadPayPalSDK() {
  const cfg = await fetch("/public/config").then(r => r.json());
  if (!cfg.paypal_client_id) throw new Error("Missing PayPal client id");

  const script = document.createElement("script");
  script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.paypal_client_id)}&currency=${encodeURIComponent(cfg.currency || "EUR")}`;
  script.onload = () => window.__CFG__ = cfg;
  document.head.appendChild(script);

  await new Promise((resolve, reject) => {
    script.onload = resolve;
    script.onerror = reject;
  });

  return cfg;
}
</script>
