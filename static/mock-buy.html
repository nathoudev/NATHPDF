<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Mock Paiement Stripe (DEV)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #020617;
      padding: 2rem;
      border-radius: 1rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid #1e293b;
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    label {
      display: block;
      margin-top: 1.2rem;
      margin-bottom: 0.25rem;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #020617;
      color: white;
      font-size: 0.95rem;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.75rem;
      border-radius: 9999px;
      border: none;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .error {
      color: #f87171;
    }
    .success {
      color: #4ade80;
    }
    .badge {
      display: inline-block;
      margin-bottom: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.7rem;
      background: #7c2d12;
      color: #fed7aa;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">DEV ONLY</span>
    <h1>Mock Paiement Stripe</h1>
    <p>
      Cette page simule un paiement Stripe réussi.<br />
      Elle appelle directement ton webhook backend.
    </p>

    <label>Email utilisateur</label>
    <input id="email" type="email" placeholder="test@example.com" />

    <button id="btn">Simuler paiement OK</button>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    const btn = document.getElementById("btn");
    const emailInput = document.getElementById("email");
    const msg = document.getElementById("msg");

    btn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      msg.textContent = "";
      msg.className = "msg";

      if (!email) {
        msg.textContent = "Merci de saisir un email.";
        msg.classList.add("error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Simulation en cours...";

      try {
        const response = await fetch(`/mock/stripe/pay?email=${encodeURIComponent(email)}`);

        if (!response.ok) {
          throw new Error("Erreur lors de la simulation");
        }

        const data = await response.json();

        msg.textContent =
          "Paiement simulé avec succès 🎉\n" +
          "→ Utilisateur créé\n" +
          "→ Clé API générée\n" +
          "→ Quota ajouté\n\n" +
          "Regarde les logs ou la base PostgreSQL.";

        msg.classList.add("success");
      } catch (err) {
        msg.textContent = err.message;
        msg.classList.add("error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Simuler paiement OK";
      }
    });
  </script>
</body>
</html>
